[project]
name = "fluidgym"
dynamic = ["version", "readme"]  # readme: see fancy-pypi-readme below
description = "Plug-and-Play Benchmarking of Reinforcement Learning Algorithms for Large-Scale Flow Control"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    { name = "Jannis Becktepe", email = "jannis.becktepe@tu-dortmund.de" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    # The solver; torch and pyamg come with it (phipict pins the torch minor
    # version its extension is built for). Released together with phipict;
    # ==0.1.* also accepts the +ptXYcuXYZ builds from the phipict wheel index.
    "phipict==0.1.*",
    "gymnasium==1.2.1",
    "numpy",
    "pandas",
    "matplotlib>=3.9",
    "seaborn",
    "huggingface_hub>=1.0.0",
    "scikit-image",
    "imageio",
    "platformdirs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/safe-autonomous-systems/fluidgym"
Documentation = "https://safe-autonomous-systems.github.io/fluidgym"

[project.optional-dependencies]
sb3 = [
    "gymnasium>=1.2.1",
    "stable-baselines3[extra]>=2.7.0",
]
torchrl = [
    "gymnasium>=1.2.1",
    "torchrl",
]
pettingzoo = [
    "gymnasium>=1.2.1",
    "pettingzoo",
]

# Development-only dependencies (PEP 735), not part of the published metadata
[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "mypy",
    "pytest",
    "types-seaborn",
    "pandas-stubs",
    "scipy-stubs",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# Version is derived from git tags (vX.Y.Z)
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/fluidgym/_version.py"

# The PyPI description is README.md with the relative links made absolute: PyPI
# resolves no relative paths and ignores GitHub's #gh-*-mode-only switch (both
# logos would show), so only the light-mode logo is kept. The files are served
# from main on GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?s)\s*<a href="[^"]*#gh-dark-mode-only">.*?</a>'
replacement = ""

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = "#gh-light-mode-only"
replacement = ""

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|href)="(?:\./)?(?!https?://|#)'
replacement = '\1="https://raw.githubusercontent.com/safe-autonomous-systems/fluidgym/main/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?:\./)?(?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/safe-autonomous-systems/fluidgym/blob/main/\1)'

[tool.hatch.build.targets.sdist]
include = [
    "/src/fluidgym",
    "/tests",
    "/LICENSES",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fluidgym"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "Q", "D"]
ignore = [
  "D104",    # Missing docstring in public package
  "D105",    # Missing docstring in magic mthod
  "D203",    # 1 blank line required before class docstring
  "D205",    # 1 blank line between summary and description
  "D401",    # First line of docstring should be in imperative mood
  "N806",    # Variable X in function should be lowercase
  "E731",    # Do not assign a lambda expression, use a def
  "A003",    # Shadowing a builtin
  "S101",    # Use of assert detected.
  "W292",    # No newline at end of file
  "PLC1901", # "" can be simplified to be falsey
  "TCH003",  # Move stdlib import into TYPE_CHECKING
  "B010",    # Do not use `setattr`
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
files = ["src/fluidgym"]
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: test needs a CUDA device (skipped otherwise)"]
